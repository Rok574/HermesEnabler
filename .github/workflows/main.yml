name: Build HermesEnabler2 IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Installed Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          if [ -d "HermesEnabler-main" ]; then
            cd HermesEnabler-main
          fi

          # Downgrade objectVersion (e.g. 110 -> 56) so current Xcode can open it
          sed -i '' 's/objectVersion = [0-9]*;/objectVersion = 56;/g' "HermesEnabler2.xcodeproj/project.pbxproj"

          xcodebuild clean build \
            -project "HermesEnabler2.xcodeproj" \
            -scheme "HermesEnabler2" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/HermesEnabler2.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r "$GITHUB_WORKSPACE/HermesEnabler2.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesEnabler2-IPA
          path: ${{ github.workspace }}/HermesEnabler2.ipa
 
